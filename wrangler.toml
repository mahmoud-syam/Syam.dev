# Cloudflare Worker: serves the course on learn.mahmoud-syam.me and stores progress per account.
name = "syam-course"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "syam-course"
database_id = "8bba0277-f0ec-4f03-9746-a2af550d576d"

[[routes]]
pattern = "learn.mahmoud-syam.me"
custom_domain = true

[vars]
# Filled in after the Cloudflare Access application is created.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
