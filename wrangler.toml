# Cloudflare Worker: serves the academy on learn.mahmoud-syam.me and stores progress per account.
# Cloudflare builds this on every push to main: build command "sh tools/public.sh", deploy command "npx wrangler deploy".
name = "syam-course"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[observability]
enabled = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "syam-course"
database_id = "8bba0277-f0ec-4f03-9746-a2af550d576d"

[[routes]]
pattern = "learn.mahmoud-syam.me"
custom_domain = true

[vars]
ORIGIN = "https://mahmoud-syam.github.io/Syam.dev"
ACCESS_TEAM_DOMAIN = "mahmoudsyam664.cloudflareaccess.com"
ACCESS_AUD = "1ad94844b786834a90e4ee575d6f0abac330ec5e1001d098ad0fab28c23ababb"
